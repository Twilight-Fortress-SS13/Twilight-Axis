Arrival-лист инквизитора. Инквизитору добавлена поясная сумка в слот плаща. Его основной рюкзак переполнялся: система последовательно проверяет спину, пояс и плащ, а не поместившиеся предметы через три секунды выбрасывает на пол. Теперь arrival-лист, ножны и остальные обязательные вещи помещаются в экипировку. 

Навыки рунлока. Эксперт арбалета и TRAIT_ARTILLERY_EXPERT убраны из базового инквизитора:

рунлок даёт Expert Firearms и TRAIT_FIREARMS_MARKSMAN;

арбалет даёт Master Crossbows и TRAIT_ARTILLERY_EXPERT.

Раньше эксперт арбалета приходил из базового класса, а рунлок просто прибавлял три уровня огнестрела от нуля. 

Arbalist’s Skin и Enduring Skin. В manual.dm дважды объявлялся один и тот же repair_check(), причём второе объявление вызывало отсутствующую родительскую проверку. Проверки объединены. Обе кожи теперь ремонтируются:

иглой с ниткой;

нагретым каутерием.

Отжимания предназначены для отдельного типа manual/pushups, поэтому именно эти две кожи чинятся шитьём. 

Музыкальная шкатулка. Повторный запуск больше не создаёт параллельный звуковой цикл. При остановке или смене мелодии старый looping_sound полностью удаляется, а при новом запуске создаётся один новый экземпляр. 

Прокачка арбалета конфессором. Конфессору добавлен отсутствовавший TRAIT_ARTILLERY_EXPERT, используемый другими инквизиторскими специалистами по арбалетам. Сам навык арбалета не имеет потолка на эксперте, а оружие отмечено как обучаемое. Этот пункт желательно отдельно проверить несколькими успешными попаданиями по валидной живой цели, поскольку полный игровой XP-цикл здесь запустить нельзя. 

Валюта Rockhill. Вместо пачки из 20 медяков теперь выдаются 4 настоящие серебряные монеты. Общая стоимость награды остаётся прежней — 20 единиц, но монеты больше не преобразуются в местную медь. 

Инквизиторский жакет. Его собственный attackby() больше не перехватывает швейный набор. Особая логика запускается только при вставке ornate cuirass, остальные предметы передаются стандартному обработчику ремонта. 

