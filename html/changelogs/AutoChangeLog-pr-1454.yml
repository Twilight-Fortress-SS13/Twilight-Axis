author: "Vladmar11"
delete-after: True
changes:
  - bugfix: "Исправлены глобальные объявления об отлучении от церкви. Excommunicate, Apostasy и Divine Curse переведены на ТГУИ выбор знакомых персонажей с отображением настоящих имён. Исправлена ошибочная проверка знакомых персонажей у епископа. Apostasy теперь корректно проверяет devotion и показывает оставшееся время кулдауна. По баг-репорту"
  - bugfix: "Исправлено создание книг: сохраняются текст, название и автор. При помещении созданной игроком книги в архив можно выбрать, сохранять ли её для будущих раундов."
  - bugfix: "Исправлено расходование ингредиентов в ритуалах Зизо."
  - bugfix: "Руну Зизо теперь нельзя нарисовать без свободного пространства 3 на 3."
  - bugfix: "Все ритуалы Зизо объединены в одну руну, теперь не надо каждый угол обгаживать рунами."
  - bugfix: "Ассасина теперь не показывает в лобби."
  - bugfix: "Убран второй лишний крафт рюзкака, теперь он один и принимает подтипы предметов."
  - bugfix: "Теперь нельзя давать вещи тем, кто сдается, чтобы они не пропадали."
  - bugfix: "Убрано дублирование фраз, которые пишутся каждый день."
  - bugfix: "Убран выбор стиля swatchbook у книг, так как, такого спрайта просто нет."
  - bugfix: "Удар колышком по вещам больше те не отбрасывает."
  - bugfix: "Фикс спрайтов у арбалетов дроу."
  - bugfix: "Теперь можно тушить фонари грязью, как и было изначально задумано"
  - bugfix: "Теперь фильтр у чуда баотистов - joyride корректно убирается."