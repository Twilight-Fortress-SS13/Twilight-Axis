author: "UEDCommander"
delete-after: True
changes:
  - balance: "Логика работы брони от пуль изменена следующим образом: теперь каждая точка брони означает 20% поглощения урона броней. Таким образом, черная сталь теперь в принципе не пробивается пулями, а у стальных вещей защита выросла в среднем на 20%."
  - balance: "Удален скейл урона от персы у огнестрела. Вместо этого, от персы теперь скейлится точность попадания в конкретную конечность, в которую мы целимся. Скейл довольно резкий, примерно 15% за каждую единицу персы."
  - balance: "Отрезан трейт Expert Gunslinger всем, у кого он был, кроме егерей, инквизитора и бладлокера."
  - balance: "Мастерский скилл владения огнестрелом мэнатармсов и конкистадора зарезан до эксперта."
  - balance: "Максимальный уровень скилла, который можно получить по вирче Grenadier Training, зарезан до эксперта, но в неё возвращен долгожданный баркер в стеше, а также теперь вирча дает трейт Expert Gunslinger, позволяющий качать навык до легенды (возможно в дальнейшем уберу, если её будет брать каждый первый). Но с этой прокачкой есть нюанс"
  - balance: "Очень сильно зарезано получение опыта от стрельбы из огнестрела - примерно в 8 раз."
  - balance: "В три раза увеличен промежуток времени, в течение которого можно целиться из огнестрела, не зарабатывая проблемы с дыхалкой (возможно далее ограничение вообще будет убрано, если новые пули не будут сносить бронированные цели как паровоз)."
  - balance: "Рунлоки больше нельзя перезаряжать на ходу, но в два-три раза был зарезан стаминокост его перезарядки (возможно уберу его совсем в дальнейшем, если все ещё будет слишком больно для стрелка)."
  - balance: "Вторичный урон пуль теперь использует то же пробитие, что и основной, а не пробитие от огня (т. е. снова проходит сквозь броню)."
  - balance: "Порезал защиту лат от пуль до 3 точек, кольчуги до 2 точек"
  - balance: "Теперь эффективный радиус стрельбы верхом режется пополам, а также выстрел из седла иммобилайзит стрелка примерно на 2 секунды"