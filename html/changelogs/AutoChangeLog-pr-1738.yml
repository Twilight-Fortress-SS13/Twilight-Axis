changes:
  - rscadd: "Скакуны теперь автоматически пытаются вырваться из менитеров. Добавлен прогрессбар освобождения."
  - balance: "Столкновение с камнями при галопе больше не сбрасывает всадника, а временно замедляет скакуна."
  - balance: "Увеличено здоровье всех скакунов, кроме пауков."
  - balance: "Все скакуны постепенно замедляются по мере потери здоровья."
  - rscadd: "Добавлены критические повреждения ног и головы скакунов, влияющие на скорость и поведение."
  - rscadd: "Скакуны теперь могут пугаться атак, выстрелов огнестрела и артиллерии, пытаясь убежать вместо ответной агрессии."